name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur proyek
        run: |
          B=app/src/main
          J=$B/java/com/stereodsp
          mkdir -p $J/dsp $J/audio $J/data $J/ui $B/res/values $B/res/drawable $B/res/mipmap-anydpi-v26
          mv -f Biquad.kt ChannelProcessor.kt ChannelSettings.kt FilterChain.kt Reverb.kt $J/dsp/
          mv -f AudioEngine.kt SystemEffect.kt SystemEffectService.kt $J/audio/
          mv -f SettingsStore.kt $J/data/
          mv -f StereoDspApp.kt $J/ui/
          mv -f MainActivity.kt DspViewModel.kt $J/
          mv -f AndroidManifest.xml $B/
          mv -f strings.xml themes.xml colors.xml $B/res/values/
          mv -f ic_launcher_foreground.xml ic_stat_nj.xml $B/res/drawable/
          mv -f ic_launcher.xml $B/res/mipmap-anydpi-v26/
          mv -f app-build.gradle.kts app/build.gradle.kts
          mv -f root-build.gradle.kts build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distr
